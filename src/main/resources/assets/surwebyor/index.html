<!DOCTYPE html>
<html lang="en">
	<head>
		<base target="_top">
		<meta charset="utf-8">
		<meta name="viewport" content="width=device-width, initial-scale=1">
	
		<title>$PAGETITLE</title>

		<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin=""/>
		<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>

		<style>
			html, body {
				height: 100%;
				margin: 0;
			}
			.leaflet-container {
				width: 100%;
				height: 100%;
			}
			.leaflet-tile-loaded {
				image-rendering: pixelated;
                filter: brightness(175%);
			}
		</style>
	</head>

	<body>
		<div id="map"></div>

		<script>
            function zx(z, x){
				if (Array.isArray(x)) {
					return L.latLng(-x[0], x[1]);
				}
				return L.latLng(-z, x);
            }


			function xz(x, z) {
				if (Array.isArray(x)) {
					return zx(x[1], x[0]);
				}
				return zx(z, x);
			};

			const map = L.map('map', {crs: L.CRS.Simple, zoomSnap: 0, zoomDelta: 0.25}).setView(xz($POSX, $POSZ), 4);
			const popup = L.popup({maxWidth: 1000});
			const tiles = L.tileLayer('/mapdata/minecraft/overworld/{x}/{y}/{z}/tile.png', {
				tms: true, maxNativeZoom: 4, minNativeZoom: 2, maxZoom: 6,
				attribution: '🇪🇺🇵🇱🦅 <a href="https://github.com/GuzioMG/Surwebyor">Surwebyor</a>'
			}).addTo(map);
		
			map.on('click', (e) => popup.setLatLng(e.latlng).setContent(`X=${e.latlng.lng} / Z=${0-e.latlng.lat}`).openOn(map));
		</script>
	</body>
</html>
